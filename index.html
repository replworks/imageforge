<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="이미지 리사이즈 작업을 줄이고 이미지 트래픽을 서버 요금과 분리하는 img.repl.net 이미지 프록시"
    />
    <title>img.repl.net — 이미지 리사이즈와 전송</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-white text-gray-900 antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-6 py-12 sm:px-10 sm:py-16">
      <header>
        <p class="font-mono text-sm text-gray-500">img.repl.net</p>
        <h1 class="mt-12 text-3xl font-semibold tracking-tight sm:mt-16 sm:text-4xl">
          이미지 작업과 전송을 간단하게.
        </h1>
        <p class="mt-4 max-w-xl leading-7 text-gray-600">
          이미지 프록시로 리사이즈 작업을 줄이고, 이미지 트래픽을 서버와 분리합니다.
        </p>
      </header>

      <section aria-label="이미지 프록시의 역할" class="mt-12 divide-y divide-gray-200 border-y border-gray-200">
        <article class="grid gap-2 py-6 sm:grid-cols-[5rem_1fr] sm:gap-4">
          <span class="font-mono text-sm text-gray-400">01</span>
          <div>
            <h2 class="font-medium">포토샵 리사이즈 작업을 없앱니다</h2>
            <p class="mt-2 leading-7 text-gray-600">
              필요한 크기를 이미지 URL에서 지정해, 크기별 파일을 따로 만들지 않습니다.
            </p>
          </div>
        </article>
        <article class="grid gap-2 py-6 sm:grid-cols-[5rem_1fr] sm:gap-4">
          <span class="font-mono text-sm text-gray-400">02</span>
          <div>
            <h2 class="font-medium">이미지 트래픽 요금을 서버 요금과 분리합니다</h2>
            <p class="mt-2 leading-7 text-gray-600">
              이미지 트래픽은 최저 요금의 글로벌 CDN으로 전송합니다.
            </p>
          </div>
        </article>
      </section>

      <footer class="mt-auto pt-12 text-sm text-gray-500">
        운영 도구
        <a class="ml-2 font-mono text-gray-700 underline underline-offset-4 hover:text-black" href="/purge/">
          /purge
        </a>
      </footer>
    </main>
  </body>
</html>
